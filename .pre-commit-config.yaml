repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.2
    hooks:
      - id: clang-format
        types_or: [c, c++]
        # The vendored zstd must stay byte-identical to its upstream release.
        exclude: ^cpp/third_party/
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args: ["doc src tests", "*.py *.rst *.md"]

  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        additional_dependencies: [toml==0.10.2]
        files: ^(pytest-pyvista/|other/)
        exclude: ^pytest-pyvista/ext/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        exclude: ^(doc/|tests/|benchmarks/)
        additional_dependencies:
          [
            "mypy-extensions==1.0.0",
            "toml==0.10.2",
            "typing-extensions==4.12.2",
          ]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: debug-statements
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: requirements-txt-fixer

  # this validates our github workflow files
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.2
    hooks:
      - id: check-github-workflows

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        args: [--fix, --show-fixes]
        exclude: ^(benchmarks/|examples/)
      - id: ruff-format

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.4
    hooks:
      - id: prettier
        types_or: [yaml, markdown, html, css, scss, javascript, json]

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        # See options: https://taplo.tamasfe.dev/configuration/formatter-options.html
        args: [--option, "reorder_arrays=true", --option, "reorder_keys=true"]

  - repo: local
    hooks:
      - id: forbid-pvz
        name: Forbid the 'pvz' alias and the 'pvz_'/'PVZ_' prefixes (use 'pvzstd')
        entry: |
          bash -c '
            matches=$(grep -HnE "\bpvz\b|\bpvz_|\bPVZ_" "$@" 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "$matches"
              echo
              echo "'\''pvz'\'' is reserved and the '\''pvz_'\''/'\''PVZ_'\'' prefixes are retired. Use \`import pyvista_zstd as pvzstd\`, and spell C ABI symbols pvzstd_/PVZSTD_. (ask @banesullivan)"
              exit 1
            fi
          ' --
        language: system
        types: [text]
        require_serial: true
        exclude: ^\.pre-commit-config\.yaml$

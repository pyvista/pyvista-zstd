name: Unit Testing and Deployment

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "*"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. The two jobs that write something back to the
# repository -- the docs deploy and the release -- raise their own.
permissions:
  contents: read

env:
  ALLOW_PLOTTING: true
  SHELLOPTS: "errexit:pipefail"

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    # Pull requests only. One of the hooks is no-commit-to-branch, which exists
    # to stop a commit landing on main directly and so fails by definition when
    # the run is the push of a merge onto main. The pull request that produced
    # that merge already ran every hook against the same tree.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: pre-commit/action@v3.0.1

  doc:
    name: Build Documentation
    runs-on: ubuntu-24.04
    # On a tag this job pushes the rendered docs to gh-pages, which the
    # workflow-level contents: read cannot do: the push is rejected with a 403
    # and takes the release job down with it, since release needs this one.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install uv
        run: pip install uv

      - name: Install pytest-pyvista with test dependencies
        # The core builds here; the gallery examples call write() and read().
        run: uv pip install --system .[docs]

      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@v5.0

      - name: Build Documentation
        run: |
          make -C doc html
          touch doc/_build/html/.nojekyll

      - name: Deploy on release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: doc/_build/html/

  unit_testing:
    name: Unit Testing
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
        vtk-version: ["9.2.6", "9.3.1", "9.4.2", "9.5.0", "latest"]
        exclude:
          # vtk 9.2.6 / 9.3.1 wheels not published for Python 3.13
          - vtk-version: "9.2.6"
            python-version: "3.13"
          - vtk-version: "9.3.1"
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install uv
        run: pip install uv

      - name: Set up vtk
        if: ${{ matrix.vtk-version != 'latest' }}
        run: uv pip install --system vtk==${{ matrix.vtk-version }}

      - name: Install with test dependencies
        env:
          PVZSTD_BUILD_CORE: "1"
        run: uv pip install --system .[tests]

      - name: Confirm the C++ core is present
        run: |
          python -c "
          from pyvista_zstd import _capi
          print('C++ core loaded from', _capi.library_path())"

      - name: Unit Testing
        run: pytest -vv

      - name: Build and verify wheels
        run: |
          uv pip install --system build twine
          python -m build
          python -m twine check dist/*

  # The distributions the release publishes. They live here, in the same
  # workflow as the release job, so that job can reach their artifacts through
  # `needs` and `download-artifact`; artifacts do not cross workflow runs.
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Linux carries its architecture per entry rather than deriving it from
        # the runner, so the arch a lane builds is readable next to the lane.
        # aarch64 is built natively on a GitHub-hosted arm64 runner; QEMU would
        # be the alternative and is an order of magnitude slower.
        include:
          - os: ubuntu-latest
            archs_linux: x86_64
          - os: ubuntu-24.04-arm
            archs_linux: aarch64
          - os: macos-latest
          - os: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          # cp310 exists only to reach glibc 2.17; see [tool.cibuildwheel] in pyproject.toml.
          # Wheels are py3-none-<platform>, so a second macOS/Windows build would collide.
          CIBW_BUILD: "cp310-* cp312-*"
          CIBW_SKIP: "*-musllinux_* cp310-macosx_* cp310-win*"
          # glibc 2.17 has no Pillow wheel; the cp312 wheel still proves the library loads.
          CIBW_TEST_SKIP: "cp310-manylinux*"
          # The platforms named here and in the matrix are the ones README.rst
          # promises a wheel for. Anything outside them installs from the sdist
          # and needs a C++ compiler; keep the two in step.
          CIBW_ARCHS_LINUX: ${{ matrix.archs_linux }}
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ENVIRONMENT: PVZSTD_BUILD_CORE=1
          CIBW_ENVIRONMENT_MACOS: PVZSTD_BUILD_CORE=1 MACOSX_DEPLOYMENT_TARGET=10.15
          CIBW_TEST_COMMAND: >
            python -c
            "from pyvista_zstd import _capi;
            print('C++ core loaded from', _capi.library_path())"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build the sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: A source install must still reach the C++ core
        env:
          PVZSTD_BUILD_CORE: "1"
        run: |
          pip install dist/*.tar.gz
          cd "$(mktemp -d)"
          python -c "
          from pyvista_zstd import _capi
          print('C++ core built from sdist:', _capi.library_path())"

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # Publish to PyPI using trusted publishing
  release:
    name: Release
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    # The wheel jobs are in the needs list because the release is what they are
    # for: without them the only artefact published is an sdist, and every
    # install on a machine with no C++ compiler fails.
    needs: [doc, unit_testing, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyvista-zstd
    permissions:
      id-token: write # mandatory for trusted publishing
      contents: write # required to create GitHub releases
    steps:
      - uses: actions/checkout@v7

      - name: Collect the wheels built for this commit
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Collect the sdist built for this commit
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: The release must carry platform wheels, not only an sdist
        run: |
          ls -l dist
          test -n "$(find dist -name '*.whl' -print -quit)" || {
            echo "::error::no wheels to publish; every install would build the C++ core from source"
            exit 1
          }
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 1
          # py3-none-any means setup.py found no compiled library to bundle, so
          # the wheel is the pure-Python shell the package stopped being.
          if find dist -name '*-py3-none-any.whl' | grep -q .; then
            echo "::error::a py3-none-any wheel carries no C++ core"
            exit 1
          fi

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

[build-system]
build-backend = "setuptools.build_meta"
# cmake drives the native core in setup.py. It is listed here so a source
# build does not depend on one being installed system-wide; when no C++
# compiler is present the build still succeeds and falls back to pure Python.
requires = ["cmake>=3.16", "setuptools-scm>=8", "setuptools>=64"]

[project]
authors = [{ name = "The PyVista developers", email = "info@pyvista.org" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["pyvista>=0.45.0", "tqdm>=4.0.0", "zstandard>=0.24.0"]
description = "VTK zstandard compression library."
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
name = "pyvista-zstd"
readme = "README.rst"
requires-python = ">=3.10"

[project.entry-points."pyvista.readers"]
".pv" = "pyvista_zstd:read"
".zvtk" = "pyvista_zstd:read"

[project.entry-points."pyvista.writers"]
".pv" = "pyvista_zstd:write"
".zvtk" = "pyvista_zstd:write"

[project.urls]
Home = "https://github.com/pyvista/pyvista-zstd"


[project.optional-dependencies]
docs = [
  "numpydoc==1.10.0",
  "sphinx-book-theme==1.2.0",
  "sphinx-copybutton==0.5.2",
  "sphinx-gallery==0.21.0",
  "sphinx-notfound-page==1.1.0",
  "sphinx==9.1.0",
]
tests = ["pytest-cov==7.1.0", "pytest>=6.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"
git_describe_command = "git describe --dirty --tags --long --match v*"
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+(?:[abrc][0-9]+)?(?:\\.post[0-9]+)?(?:\\.dev[0-9]+)?)$"
version_file = "src/pyvista_zstd/_version.py"

# Which manylinux image each Linux wheel is built in. This lives here rather
# than beside the other cibuildwheel settings in the workflow because it
# differs per interpreter, and only a config file can say that -- an
# environment variable would apply one image to every build and would also
# take precedence over these overrides.
#
# The choice is driven by NumPy, because a wheel is only useful where the
# things it imports are installable too. NumPy 2.3 dropped both Python 3.10
# and glibc 2.17, and those two happen to line up exactly:
#
#   Python 3.10  pinned to NumPy <= 2.2.6 by requires-python, and 2.2.6 is
#                the last release shipping a cp310 manylinux2014 wheel, so
#                the old image still resolves -- build there and reach the
#                older distributions.
#   Python 3.12  resolves NumPy 2.5.x, whose lowest x86_64 tag is
#                manylinux_2_27. In the 2014 image pip finds no wheel, falls
#                back to the sdist, and the build fails on that image's
#                gcc 10.2.1 against NumPy's required >= 10.3.
[tool.cibuildwheel]
manylinux-x86_64-image = "manylinux_2_28"

[[tool.cibuildwheel.overrides]]
manylinux-x86_64-image = "manylinux2014"
select = "cp310-*"

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
exclude = ['.git', 'build', 'dist', 'doc/_build', 'doc/examples', 'pycache__']
indent-width = 4
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = ["COM812", "D203", "D212", "ISC001"]
select = ["ALL"]

[tool.ruff.lint.isort]
# Sort by name, don't cluster "from" vs "import"
force-sort-within-sections = true
# Combines "as" imports on the same line
combine-as-imports = true
force-single-line = true
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"doc/**" = ["INP001"]
# A build script legitimately prints its progress and shells out to the build
# tool it exists to drive; `cmake` is resolved from PATH on purpose, because
# pinning an absolute path would break every environment that installs it
# somewhere else (including the cmake wheel this build depends on).
"setup.py" = ["S603", "S607", "T201"]
"tests/**" = ["ANN001", "INP001", "S101"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pytest.ini_options]
addopts = "--cov=pyvista_zstd --cov-fail-under=90"
testpaths = 'tests'

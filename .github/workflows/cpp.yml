name: C++ Core

# The C++ core, the platforms it has to build on, and the wheels that carry it.
#
# Each job proves something the others cannot:
#
#   cmake   the library builds on every desktop platform and agrees with the
#           pure-Python implementation bit for bit
#   wasm    the same sources build and *run* under WebAssembly, checked by
#           diffing a real container dump against the host build
#   wheels  the shared object we ship actually loads on the target platform
#   sdist   a source install can still reach the C++ core
#
# The parity suite lives in the cmake job rather than the wheel job on purpose:
# the wheel test environments cannot install a rendering stack on every exotic
# platform tag, and a test that gets skipped everywhere proves nothing.

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "*"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLOPTS: "errexit:pipefail"

jobs:
  cmake:
    name: CMake + parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Configure
        shell: bash
        run: |
          # Pinned zstd, not the distribution's. The byte-identity tests
          # compare against a reference writer that carries its own copy of
          # zstd, and different zstd versions emit different (equally valid)
          # frames for the same input. Linking whatever the runner happened to
          # have installed made those tests fail on Linux while the same
          # commit passed on macOS and Windows, which have no system zstd to
          # find -- a difference in the dependency, not in this writer.
          cmake -S cpp -B cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPVZSTD_BUILD_SHARED=ON \
            -DPVZSTD_BUILD_TOOLS=ON \
            -DPVZSTD_ZSTD_PROVIDER=vendored

      - name: Build
        shell: bash
        run: cmake --build cpp/build --config Release --parallel

      - name: Locate the build artefacts
        shell: bash
        run: |
          # Multi-config generators (Visual Studio) put these under Release/,
          # single-config generators put them at the top of the build tree.
          find_one() {
            found=$(find cpp/build -name "$1" -type f | head -n 1)
            if [ -z "$found" ]; then
              echo "::error::did not find $1 in the build tree"
              find cpp/build -type f \( -name 'pvzstd_*' -o -name '*pvzstd*' \)
              exit 1
            fi
            echo "$found"
          }
          case "${{ runner.os }}" in
            Windows) libname=pvzstd.dll; suffix=.exe ;;
            macOS)   libname=libpvzstd.dylib; suffix= ;;
            *)       libname=libpvzstd.so; suffix= ;;
          esac
          {
            echo "PVZSTD_LIBRARY=$(pwd)/$(find_one "$libname")"
            echo "PVZSTD_DUMP=$(pwd)/$(find_one "pvzstd_dump$suffix")"
            echo "PVZSTD_REWRITE=$(pwd)/$(find_one "pvzstd_rewrite$suffix")"
            echo "PVZSTD_APPEND=$(pwd)/$(find_one "pvzstd_append$suffix")"
            echo "PVZSTD_STREAM=$(pwd)/$(find_one "pvzstd_stream$suffix")"
          } >> "$GITHUB_ENV"

      - name: Install the package as pure Python
        shell: bash
        # Deliberately pure: this job is testing the CMake build above, pointed
        # at by PVZSTD_LIBRARY. Letting the install compile its own copy would
        # mean the artefact under test was never the one exercised.
        env:
          PVZSTD_BUILD_CORE: "0"
        run: |
          python -m pip install --upgrade pip
          pip install .[tests]

      - name: Confirm the tests will use the CMake build
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pyvista_zstd import _capi

          expected = os.environ["PVZSTD_LIBRARY"]
          assert _capi.available(), f"C++ core did not load: {_capi.load_error()}"
          actual = _capi.library_path()
          assert actual == expected, f"loaded {actual}, expected {expected}"
          print(f"ABI {_capi.ABI_VERSION} from {actual}")
          PY

      - name: Conformance and parity
        shell: bash
        run: pytest tests -vv

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Build for the host
        run: |
          cmake -S cpp -B cpp/build-host -DCMAKE_BUILD_TYPE=Release -DPVZSTD_BUILD_TOOLS=ON
          cmake --build cpp/build-host --parallel

      - name: Build for WebAssembly
        # pthreads are enabled so that zstd keeps its multithreaded mode. The
        # writer refuses to run without it rather than silently emitting
        # different bytes, so a single-threaded WASM build would not be the
        # same library.
        run: |
          emcmake cmake -S cpp -B cpp/build-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DPVZSTD_BUILD_SHARED=OFF \
            -DPVZSTD_BUILD_TOOLS=ON \
            -DCMAKE_C_FLAGS=-pthread \
            -DCMAKE_CXX_FLAGS=-pthread \
            -DCMAKE_EXE_LINKER_FLAGS="-pthread -sPTHREAD_POOL_SIZE=4 -sALLOW_MEMORY_GROWTH=1 -sNODERAWFS=1 -sEXIT_RUNTIME=1"
          cmake --build cpp/build-wasm --parallel

      - name: Write the containers to read back
        run: |
          python -m pip install --upgrade pip
          PVZSTD_BUILD_CORE=0 pip install .[tests]
          PYTHONPATH=tests/conformance python - <<'PY'
          import numpy as np
          import pyvista as pv
          import ref_reader

          import pyvista_zstd as pz

          # Two fixtures, because they reach different code.
          #
          # `sphere` is a few tens of kilobytes: every frame compresses on the
          # calling thread, so it isolates the format and the filter from the
          # worker-count rule.
          #
          # `bulk` is 2 MiB of incompressible doubles, which is what it takes
          # to make the writer ask zstd for a worker at all and to put a single
          # frame over the megabyte above which zstd's threaded and unthreaded
          # output stop being byte-identical. Without it the threading this
          # build enables would never actually run, and a WebAssembly build
          # that quietly lost its workers would still pass.
          rng = np.random.default_rng(7)
          sphere = pv.Sphere(theta_resolution=24, phi_resolution=24)
          sphere.point_data["scal_f64"] = rng.random(sphere.n_points)
          sphere.point_data["vec_f32"] = rng.random((sphere.n_points, 3)).astype(np.float32)
          sphere.cell_data["ids_i64"] = np.arange(sphere.n_cells, dtype=np.int64)

          bulk = pv.ImageData(dimensions=(64, 64, 64))
          bulk.point_data["bulk_f64"] = np.random.default_rng(21).random(bulk.n_points)

          # shuffle=True so the filter branch is exercised under WebAssembly.
          # It is off by default, and a run that never enters the branch would
          # not have tested it.
          for name, ds in (("sphere", sphere), ("bulk", bulk)):
              path = f"{name}.pv"
              pz.write(ds, path, shuffle=True, progress_bar=False)
              # The settings that produced the file, so the rewrite below is
              # asked for the same bytes rather than for bytes of its own.
              container = ref_reader.read(path)
              with open(f"{name}.args", "w") as fh:
                  fh.write(
                      "%s %s %s\n"
                      % (
                          container.file_metadata["compression_level"],
                          "1" if container.ds_metadata.get("fixed_cell_sizes") else "0",
                          container.file_metadata["frame_names"][0][:16],
                      )
                  )
          PY

      - name: The WASM reader must agree with the host reader, byte for byte
        run: |
          for name in sphere bulk; do
            ./cpp/build-host/pvzstd_dump "$name.pv" > "$name.host.txt"
            node cpp/build-wasm/pvzstd_dump.js "$name.pv" > "$name.wasm.txt"
            # pvzstd_dump prints an FNV-1a checksum of every decompressed payload,
            # so an identical dump means decompression and filter reversal both
            # produced the same bytes -- not merely that the file parsed.
            diff "$name.host.txt" "$name.wasm.txt"
            echo "== $name: WebAssembly read is identical to the host read"
            cat "$name.wasm.txt"
          done

      - name: The WASM writer must reproduce the reference writer's bytes
        # The step above only proves WebAssembly can *read* what someone else
        # wrote. This one runs the writer: pvzstd_rewrite reads the container and
        # writes it back, and the output has to equal the file the Python
        # reference writer produced, byte for byte -- the same property the
        # writer-parity suite gates natively, asked of the WASM build.
        #
        # -2 is PVZSTD_THREADS_AUTO: the worker count is resolved by our
        # replication of the reference's rule, which is the part that a
        # threadless WebAssembly build would get wrong.
        run: |
          for name in sphere bulk; do
            read -r level fixed uid < "$name.args"
            node cpp/build-wasm/pvzstd_rewrite.js \
              "$name.pv" "$name.wasm.pv" "$level" -2 1 "$fixed" "$uid"
            if ! cmp "$name.pv" "$name.wasm.pv"; then
              echo "::error::the WASM writer's $name output differs from the reference writer's"
              ls -l "$name.pv" "$name.wasm.pv"
              exit 1
            fi
            echo "== $name: WebAssembly write is byte-identical to the reference writer"
          done

  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm needs the tags to derive a version.
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          # One wheel per platform, not one per interpreter: the bundled
          # library is loaded through ctypes and carries no CPython ABI, and
          # setup.py tags the wheel py3-none-<platform> to say so.
          # Two Linux wheels, from two images: see [tool.cibuildwheel] in
          # pyproject.toml for which image each of these gets and why. The
          # 3.10 build exists to reach glibc 2.17, which 3.12 no longer can.
          CIBW_BUILD: "cp310-* cp312-*"
          # No musl wheels. The package requires a rendering stack that
          # publishes none, so a musllinux wheel of this project could not be
          # installed alongside its own dependencies -- cibuildwheel's install
          # test proves it by failing to resolve them.
          #
          # And no second macOS or Windows wheel: the 3.10 build is only here
          # for the older manylinux image, and since these wheels are tagged
          # py3-none-<platform> rather than per-interpreter, building 3.10
          # there would produce a file of exactly the same name as the 3.12
          # one. The two Linux wheels differ because their platform tags do.
          CIBW_SKIP: "*-musllinux_* cp310-macosx_* cp310-win*"
          # The 3.10 wheel is built but not install-tested, for the same
          # reason musllinux is not built at all: on glibc 2.17 the rendering
          # stack has no wheels to install. NumPy still resolves there -- 2.2.6
          # is the last release with a cp310 manylinux2014 wheel and 3.10 can
          # never ask for a newer one -- but Pillow has none, so pip compiles
          # it and stops for want of jpeg headers the image does not carry.
          #
          # That is a fact about the dependencies, not about our wheel, and it
          # is not worth dropping the wheel over: the shared object inside it
          # is built from these sources by the same job, and the 3.12 wheel
          # install-tests that it loads. What goes untested here is only
          # whether a full environment can be assembled on glibc 2.17, which
          # today it cannot, by anyone.
          CIBW_TEST_SKIP: "cp310-manylinux*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: AMD64
          # A wheel that quietly lost its C++ core is the failure mode this
          # whole job exists to prevent, so make it fatal at build time.
          CIBW_ENVIRONMENT: PVZSTD_BUILD_CORE=1
          CIBW_ENVIRONMENT_MACOS: PVZSTD_BUILD_CORE=1 MACOSX_DEPLOYMENT_TARGET=10.15
          # Checks the property that only a wheel can have: that the shared
          # object inside it loads on the machine the wheel targets. The
          # correctness of that library is the cmake job's business.
          CIBW_TEST_COMMAND: >
            python -c
            "from pyvista_zstd import _capi;
            assert _capi.available(), _capi.load_error();
            print('C++ core loaded from', _capi.library_path())"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build the sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: A source install must still reach the C++ core
        # The sdist has to carry cpp/. If it does not, this install silently
        # degrades to pure Python and the assertion below catches it.
        env:
          PVZSTD_BUILD_CORE: "1"
        run: |
          pip install dist/*.tar.gz
          cd "$(mktemp -d)"
          python -c "
          from pyvista_zstd import _capi
          assert _capi.available(), _capi.load_error()
          print('C++ core built from sdist:', _capi.library_path())"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

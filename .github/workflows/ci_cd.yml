name: Unit Testing and Deployment

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "*"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ALLOW_PLOTTING: true
  SHELLOPTS: "errexit:pipefail"

jobs:
  doc:
    name: Build Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install uv
        run: pip install uv

      - name: Install pytest-pyvista with test dependencies
        # The documentation build does not exercise the C++ core, so skip
        # compiling it rather than paying for a zstd build on every doc run.
        env:
          PVZSTD_BUILD_CORE: "0"
        run: uv pip install --system .[docs]

      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@v4.3

      - name: Build Documentation
        run: |
          make -C doc html
          touch doc/_build/html/.nojekyll

      - name: Deploy on release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: doc/_build/html/

  unit_testing:
    name: Unit Testing
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
        vtk-version: ["9.2.6", "9.3.1", "9.4.2", "9.5.0", "latest"]
        exclude:
          # vtk 9.2.6 / 9.3.1 wheels not published for Python 3.13
          - vtk-version: "9.2.6"
            python-version: "3.13"
          - vtk-version: "9.3.1"
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install uv
        run: pip install uv

      - name: Set up vtk
        if: ${{ matrix.vtk-version != 'latest' }}
        run: uv pip install --system vtk==${{ matrix.vtk-version }}

      - name: Install with test dependencies
        # The install compiles the C++ core and bundles it into the
        # package. Required, not best-effort: without it the C++ core is
        # never exercised here, and a silent fallback would leave most of
        # _capi.py untested while the suite still passed.
        env:
          PVZSTD_BUILD_CORE: "1"
        run: uv pip install --system .[tests]

      - name: Confirm the C++ core is present
        # `backend="auto"` falls back to pure Python by design, so nothing in
        # the suite below fails just because the C++ core went missing.
        # Assert it separately or this job cannot tell the two apart.
        run: |
          python -c "
          from pyvista_zstd import _capi
          assert _capi.available(), _capi.load_error()
          print('C++ core loaded from', _capi.library_path())"

      - name: Unit Testing
        run: pytest -vv

      - name: Build and verify wheels
        run: |
          uv pip install --system build twine
          python -m build
          python -m twine check dist/*

  # Publish to PyPI using trusted publishing
  release:
    name: Release
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    needs: [doc, unit_testing]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyvista-zstd
    permissions:
      id-token: write # mandatory for trusted publishing
      contents: write # required to create GitHub releases
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13

      - name: Build distributions
        # Deliberately pure Python, which is what this job has always
        # published. This runner is Linux, so building the C++ core here
        # would produce a single linux_x86_64 wheel and publish it as the
        # package's only wheel -- worse for macOS and Windows users than the
        # portable pure-Python one they get today.
        #
        # Per-platform wheels are built and tested by the C++ Core
        # workflow. Publishing those instead is a deliberate follow-up: it
        # needs a second trusted publisher registered for that workflow file,
        # which is a repository setting rather than a change to this file.
        env:
          PVZSTD_BUILD_CORE: "0"
        run: |
          pip install build
          python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          files: |
            ./**/*.whl
